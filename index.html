<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DESABAFO EXPRESS 🤬</title>
    <!-- Ícones FontAwesome (necessários para os ícones de coração, cópia e sucesso) -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --bg-color: #121212;
            --card-bg: #1e1e1e;
            --text-color: #e0e0e0;
            --accent-color: #ff3e3e;
            --success: #00ff88;
        }

        body {
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            flex-direction: column; /* Empilha os elementos verticalmente */
            align-items: center;
            min-height: 100vh; /* Garante que o fundo cubra a tela toda */
            margin: 0;
            overflow-y: auto; /* Permite a rolagem se o conteúdo crescer */
            padding: 1px 0; /* Dá um respiro no topo e no final */
        }
        
        /* Ajuste do corpo para dar espaço ao banner fixo no topo */
        body {
            padding-top: 75px;
        }

        .container {
            background-color: var(--card-bg);
            padding: 1rem; /* Reduzi de 2rem para 1rem */
            border-radius: 20px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.7);
            width: 90%;
            max-width: 400px; /* Reduzi um pouco a largura, 450 para 400 */
            text-align: center;
            border: 1px solid #333;
            margin-top: 0px; /* Garante que comece colado no topo */
        }

        h1 { margin-bottom: 0 0 0.5rem 0; color: var(--accent-color); font-size: 1.3rem; }
        p { color: #bbb; margin-bottom: 0.8rem;font-size: 0.9rem; }

        textarea {
            width: 100%;
            padding: 8px;
            border-radius: 10px;
            border: 1px solid #444;
            background: #2a2a2a;
            color: white;
            margin-bottom: 0.5rem;
            resize: none;
            box-sizing: border-box;
            font-size: 1rem;
        }

        .termometro {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 6px;
            margin-bottom: 0.8rem;
        }

        .btn-nivel {
            padding: 12px 5px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 800;
            text-transform: uppercase;
            transition: all 0.2s ease;
            color: #111;
            font-size: 0.7rem;
        }

        .baixo { background-color: #4cd137; }
        .medio { background-color: #fbc531; }
        .alto { background-color: #e67e22; }
        .aaaa { 
            background-color: #c23616; 
            color: white;
            grid-column: span 3;
            animation: shake 0.5s infinite;
        }

        @keyframes shake {
            0% { transform: translate(1px, 1px) rotate(0deg); }
            10px { transform: translate(-1px, -2px) rotate(-1deg); }
            20% { transform: translate(-3px, 0px) rotate(1deg); }
            100% { transform: translate(1px, 1px) rotate(0deg); }
        }

        .active { 
            box-shadow: 0 0 15px white;
            transform: scale(1.05);
            outline: 2px solid white;
        }

        #display-mantra {
            font-size: 2rem;
            font-weight: 900;
            min-height: 120px;
            margin: 20px 0;
            color: #fff200;
            display: flex;
            align-items: center;
            justify-content: center;
            text-transform: uppercase;
            line-height: 1.2;
        }

        #timer {
            font-size: 4rem;
            margin-bottom: 1rem;
            font-family: 'Courier New', Courier, monospace;
            color: var(--accent-color);
        }

        .hidden { display: none; }

        #start-btn {
            width: 100%;
            padding: 15px;
            border-radius: 10px;
            border: none;
            background: var(--accent-color);
            color: white;
            font-weight: bold;
            font-size: 1.1rem;
            cursor: pointer;
            box-shadow: 0 5px 15px rgba(255, 62, 62, 0.4);
        }

        #btn-cancelar {
            background: transparent;
            border: 1px solid #555;
            color: #888;
            padding: 8px 15px;
            border-radius: 5px;
            cursor: pointer;
            margin-top: 20px;
        }

        /* Estilo da Nova Seção de Doação Pix Copia e Cola */
        .pagamento-footer {
            margin-top: 20px;
            padding-top: 10px;
            border-top: 1px solid #333;
            text-align: left;
        }
        
        .pagamento-footer p {
            font-size: 0.8rem;
            margin-bottom: 6px;
        }
    </style>
</head>
<body>

    <!-- ANÚNCIO FIXO NO TOPO -->
    <div id="ad-container-topo" style="position: fixed; top: 0; left: 0; width: 100%; background: rgba(18, 18, 18, 0.95); border-bottom: 1px solid #333; padding: 5px 0; z-index: 1000; display: flex; flex-direction: column; align-items: center; box-shadow: 0 4px 10px rgba(0,0,0,0.5);">
        <p style="font-size: 0.55rem; opacity: 0.4; margin-bottom: 2px; text-transform: uppercase; letter-spacing: 1px; color: #fff;">Publicidade</p>
        <div id="ad-slot-topo"></div>
    </div>

    <div class="container" id="setup-screen">
        <h1>DESABAFO EXPRESS 🤬</h1>
        <p>Escreva o que te irritou:</p>
        <textarea id="motivo" rows="3" placeholder="Aquele e-mail às 18h..."></textarea>
        
        <p>Nível de Ódio:</p>
        <div class="termometro">
            <button class="btn-nivel baixo" onclick="setNivel('baixo', 10, this)">Baixo (10s)</button>
            <button class="btn-nivel medio" onclick="setNivel('medio', 20, this)">Médio (20s)</button>
            <button class="btn-nivel alto" onclick="setNivel('alto', 30, this)">Alto (30s)</button>
            <button class="btn-nivel aaaa" onclick="setNivel('AAAHHHH', 60, this)">AAAHHHH (1min)</button>
        </div>

        <button id="start-btn" onclick="iniciarSessao()">COMEÇAR TERAPIA</button>
        
        <!-- NOVA SEÇÃO DE DOAÇÃO PIX -->
        <div class="pagamento-footer">
            <p class="font-semibold text-slate-200 mb-0.5 flex items-center gap-1" style="color: #e0e0e0;">
                <i class="fa-solid fa-heart text-red-500"></i> Curtiu? Apoie o desenvolvedor!
            </p>
            <p style="font-size: 10px; color: #888; margin-bottom: 8px;">Sua doação ajuda a manter a ferramenta online.</p>
            
            <div class="flex items-center gap-2" style="display: flex; gap: 8px;">
                <input type="text" id="inputValorDoacao" value="Digite um valor..." oninput="mascaraMoeda(this)" style="flex-grow: 1; background: #2a2a2a; border: 1px solid #444; border-radius: 8px; padding: 6px 8px; text-align: center; color: white; font-weight: bold; font-size: 0.9rem; margin-bottom: 0;">
                <button onclick="gerarECopiarPixDoacao()" style="background-color: #00FF5F; color: #000; font-weight: bold; border: none; border-radius: 8px; padding: 6px 12px; font-size: 0.8rem; cursor: pointer; transition: 0.2s; white-space: nowrap;">
                    <i class="fa-regular fa-copy"></i> Copiar Pix
                </button>
            </div>
            <p id="msgSucessoPix" style="font-size: 10px; color: #00ff88; font-weight: bold; margin-top: 6px; display: none;">
                <i class="fa-solid fa-check-circle"></i> Pix Copia e Cola copiado! Abra o app do banco.
            </p>
        </div>
    </div>

    <div class="container hidden" id="timer-screen">
        <h2 style="color: #888;">NÃO PARE DE REPETIR:</h2>
        <div id="display-mantra"></div>
        <div id="timer">00</div>
        <button id="btn-cancelar" onclick="resetar()">Me acalmei (ou alguém chegou)</button>
    </div>
    
    <div id="ad-container" style="position: fixed; top: 0; left: 0; width: 100%; background: rgba(18, 18, 18, 0.95); border-bottom: 1px solid #333; padding: 5px 0; z-index: 1000; display: flex; flex-direction: column; align-items: center; box-shadow: 0 4px 10px rgba(0,0,0,0.5);">
        <p style="font-size: 0.55rem; opacity: 0.4; margin-bottom: 2px; text-transform: uppercase; letter-spacing: 1px; color: #fff;">Publicidade</p>
        <div id="ad-slot"></div>
    </div>

    <script>
        // Configurações da Chave Pix
        const CHAVE_PIX_RECEPTOR = "matheuzzu@hotmail.com"; 
        const NOME_RECEPTOR = "MATHEUS ARRUDA MAIA";                  
        const CIDADE_RECEPTOR = "FORTALEZA";                        
    
        function gerarPayloadPix(chave, nome, cidade, valor, txid = "***") {
            function formatField(id, value) {
                const len = value.length.toString().padStart(2, '0');
                return `${id}${len}${value}`;
            }
    
            const gui = formatField('00', 'br.gov.bcb.pix');
            const key = formatField('01', chave);
            const merchantAccount = formatField('26', `${gui}${key}`);
            
            const categoryCode = formatField('52', '0000');
            const currency = formatField('53', '986'); // BRL
            const amountStr = parseFloat(valor).toFixed(2);
            const amount = formatField('54', amountStr);
            const country = formatField('58', 'BR');
            const name = formatField('59', nome.substring(0, 25));
            const city = formatField('60', cidade.substring(0, 15));
            const additionalData = formatField('62', formatField('05', txid));
    
            let payload = `000201${merchantAccount}${categoryCode}${currency}${amount}${country}${name}${city}${additionalData}6304`;
            
            function crc16(str) {
                let crc = 0xFFFF;
                for (let i = 0; i < str.length; i++) {
                    crc ^= str.charCodeAt(i) << 8;
                    for (let j = 0; j < 8; j++) {
                        if ((crc & 0x8000) !== 0) {
                            crc = (crc << 1) ^ 0x1021;
                        } else {
                            crc = crc << 1;
                        }
                    }
                }
                return (crc & 0xFFFF).toString(16).toUpperCase().padStart(4, '0');
            }
    
            return payload + crc16(payload);
        }
    
        function gerarECopiarPixDoacao() {
            const inputElement = document.getElementById('inputValorDoacao');
            let rawDigits = inputElement.value.replace(/\D/g, "");
            
            if (!rawDigits) {
                alert('Por favor, informe um valor de doação válido.');
                return;
            }
        
            const valor = parseFloat(rawDigits) / 100;
        
            if (isNaN(valor) || valor <= 0) {
                alert('Por favor, informe um valor de doação válido.');
                return;
            }
        
            const pixPayload = gerarPayloadPix(CHAVE_PIX_RECEPTOR, NOME_RECEPTOR, CIDADE_RECEPTOR, valor);
        
            navigator.clipboard.writeText(pixPayload).then(() => {
                const msg = document.getElementById('msgSucessoPix');
                if (msg) {
                    msg.style.display = 'block';
                    setTimeout(() => {
                        msg.style.display = 'none';
                    }, 5000);
                }
            }).catch(err => {
                alert('Não foi possível copiar automaticamente. Tente novamente.');
            });
        }

        // Máscara monetária acumulativa
        function mascaraMoeda(input) {
            let value = input.value.replace(/\D/g, "");
            
            if (!value || value === "00") {
                input.value = "R$ 0,00";
                return;
            }
            
            let numberValue = (parseInt(value, 10) / 100).toFixed(2);
            let formatted = numberValue
                .replace(".", ",")
                .replace(/(\d)(?=(\d{3})+(?!\d))/g, "$1.");
        
            input.value = "R$ " + formatted;
        }
    </script>

    <script>
        // Função de Auto-Refresh para os Anúncios do Adsterra (Topo e Fundo)
        function refreshAds() {
            // Atualizar Anúncio do Topo
            const adSlotTopo = document.getElementById('ad-slot-topo');
            adSlotTopo.innerHTML = ''; 
            
            const scriptConfigTopo = document.createElement('script');
            scriptConfigTopo.type = 'text/javascript';
            scriptConfigTopo.text = `
                atOptions = {
                    'key' : 'f95477b41aad412b789767be6416723b',
                    'format' : 'iframe',
                    'height' : 50,
                    'width' : 320,
                    'params' : {}
                };
            `;
            const scriptInvokeTopo = document.createElement('script');
            scriptInvokeTopo.type = 'text/javascript';
            scriptInvokeTopo.src = '//www.highperformanceformat.com/f95477b41aad412b789767be6416723b/invoke.js';
            
            adSlotTopo.appendChild(scriptConfigTopo);
            adSlotTopo.appendChild(scriptInvokeTopo);

            // Atualizar Anúncio do Fundo
            const adSlot = document.getElementById('ad-slot');
            adSlot.innerHTML = ''; 
            
            const scriptConfig = document.createElement('script');
            scriptConfig.type = 'text/javascript';
            scriptConfig.text = `
                atOptions = {
                    'key' : 'f95477b41aad412b789767be6416723b',
                    'format' : 'iframe',
                    'height' : 50,
                    'width' : 320,
                    'params' : {}
                };
            `;
            const scriptInvoke = document.createElement('script');
            scriptInvoke.type = 'text/javascript';
            scriptInvoke.src = '//www.highperformanceformat.com/f95477b41aad412b789767be6416723b/invoke.js';
            
            adSlot.appendChild(scriptConfig);
            adSlot.appendChild(scriptInvoke);
        }

        // Inicia os anúncios e define o ciclo de 30 segundos
        refreshAds();
        setInterval(refreshAds, 30000);
    </script>

    <script>
        let tempoSelecionado = 0;
        let countdown;
        const frases = ["Vá pra puta que pariu!", "Vá tomar no cu!", "Vá se fuder!", "Vá se lascar!"];
        const sintetizador = window.speechSynthesis;

        function setNivel(nome, tempo, element) {
            tempoSelecionado = tempo;
            document.querySelectorAll('.btn-nivel').forEach(b => b.classList.remove('active'));
            element.classList.add('active');
        }

        function falar(texto) {
            sintetizador.cancel();
            const fala = new SpeechSynthesisUtterance(texto);
            fala.lang = 'pt-BR';
            fala.rate = 1.2;
            fala.pitch = 1;
            sintetizador.speak(fala);
        }

        function iniciarSessao() {
            if (tempoSelecionado === 0) {
                alert("Selecione o quanto você está puto primeiro!");
                return;
            }

            document.getElementById('setup-screen').classList.add('hidden');
            document.getElementById('timer-screen').classList.remove('hidden');
            
            let tempoRestante = tempoSelecionado;
            const displayTimer = document.getElementById('timer');
            const displayMantra = document.getElementById('display-mantra');
            
            const fraseInicial = frases[Math.floor(Math.random() * frases.length)];
            displayMantra.innerText = fraseInicial;
            falar(fraseInicial);

            countdown = setInterval(() => {
                tempoRestante--;
                displayTimer.innerText = tempoRestante < 10 ? `0${tempoRestante}` : tempoRestante;

                if (tempoRestante > 0 && tempoRestante % 3 === 0) {
                    const novaFrase = frases[Math.floor(Math.random() * frases.length)];
                    displayMantra.innerText = novaFrase;
                    falar(novaFrase);
                }

                if (tempoRestante <= 0) {
                    clearInterval(countdown);
                    falar("Pronto. Agora respira fundo e volta a trabalhar.");
                    setTimeout(() => alert("Sessão finalizada. Aliviado?"), 500);
                    resetar();
                }
            }, 1000);
        }

        function resetar() {
            clearInterval(countdown);
            sintetizador.cancel();
            document.getElementById('timer-screen').classList.add('hidden');
            document.getElementById('setup-screen').classList.remove('hidden');
            document.getElementById('timer').innerText = "00";
            document.getElementById('motivo').value = "";
            tempoSelecionado = 0;
            document.querySelectorAll('.btn-nivel').forEach(b => b.classList.remove('active'));
        }
    </script>
</body>
</html>
